<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="960" viewBox="0 0 1170 960">
    <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7890a3"/></marker></defs>
    <rect width="100%" height="100%" fill="#f7f9fc"/><style>text{font-family:Arial,sans-serif;fill:#233e54}.title{font-size:27px;font-weight:bold}.sub{font-size:12px;fill:#71879b}.name{font-size:13px;font-weight:bold;fill:white}.field{font-size:11px}.edge{fill:none;stroke:#8b9eaf;stroke-width:1.5}.label{font-size:10px;fill:#526e87}</style>
    <text x="35" y="45" class="title">Orbit Archive / Relational design</text><text x="35" y="69" class="sub">1 : 0..N edges unless stated · PK = primary key · FK = foreign key · Full attributes in data dictionary</text><path d="M240 150 H300 V190 H340" class="edge" marker-end="url(#arrow)"/><text x="265" y="137" class="label">star → planet</text><path d="M445 254 V340 H550 V410" class="edge" marker-end="url(#arrow)"/><text x="448" y="330" class="label">planet → discovery</text><path d="M920 190 H875 V345 H730 V410" class="edge" marker-end="url(#arrow)"/><text x="740" y="333" class="label">mission → discovery</text><path d="M1020 235 V315" class="edge" marker-end="url(#arrow)"/><text x="1025" y="301" class="label">1 : 0..N</text><path d="M1020 120 V87 H780 V120" class="edge" marker-end="url(#arrow)"/><text x="820" y="81" class="label">mission → observation</text><path d="M138 120 V100 H690 V120" class="edge" marker-end="url(#arrow)"/><text x="245" y="94" class="label">star → observation</text><path d="M240 440 H320 V460 H525" class="edge" marker-end="url(#arrow)"/><text x="285" y="431" class="label">method → discovery</text><path d="M140 690 V580 H525 V500" class="edge" marker-end="url(#arrow)"/><text x="185" y="569" class="label">researcher → discovery</text><path d="M240 740 H340" class="edge" marker-end="url(#arrow)"/><text x="260" y="727" class="label">reviews</text><path d="M620 602 V710 H545" class="edge" marker-end="url(#arrow)"/><text x="622" y="661" class="label">discovery → validation</text><path d="M240 777 H290 V880 H340" class="edge" marker-end="url(#arrow)"/><text x="295" y="867" class="label">1 : 0..1</text><rect x="35" y="120" width="205" height="134" rx="7" fill="white" stroke="#cfdae4"/><path d="M42 120 H233 Q240 120 240 127 V151 H35 V127 Q35 120 42 120" fill="#24475f"/><text x="47" y="141" class="name">STAR</text><text x="47" y="169" class="field">PK star_id</text><text x="47" y="188" class="field">UQ star_name</text><text x="47" y="207" class="field">spectral_type, distance_ly</text><text x="47" y="226" class="field">temperature_k</text><text x="47" y="245" class="field">hz_inner_au, hz_outer_au</text><rect x="340" y="120" width="205" height="134" rx="7" fill="white" stroke="#cfdae4"/><path d="M347 120 H538 Q545 120 545 127 V151 H340 V127 Q340 120 347 120" fill="#24475f"/><text x="352" y="141" class="name">PLANET</text><text x="352" y="169" class="field">PK planet_id</text><text x="352" y="188" class="field">UQ planet_name</text><text x="352" y="207" class="field">FK star_id</text><text x="352" y="226" class="field">radius_earth, mass_earth</text><text x="352" y="245" class="field">period_days, distance_au</text><rect x="620" y="120" width="205" height="77" rx="7" fill="white" stroke="#cfdae4"/><path d="M627 120 H818 Q825 120 825 127 V151 H620 V127 Q620 120 627 120" fill="#24475f"/><text x="632" y="141" class="name">MISSION_STAR</text><text x="632" y="169" class="field">PK/FK mission_id</text><text x="632" y="188" class="field">PK/FK star_id</text><rect x="920" y="120" width="205" height="115" rx="7" fill="white" stroke="#cfdae4"/><path d="M927 120 H1118 Q1125 120 1125 127 V151 H920 V127 Q920 120 927 120" fill="#24475f"/><text x="932" y="141" class="name">MISSION</text><text x="932" y="169" class="field">PK mission_id</text><text x="932" y="188" class="field">UQ mission_name</text><text x="932" y="207" class="field">launch_date</text><text x="932" y="226" class="field">agency, status</text><rect x="920" y="315" width="205" height="115" rx="7" fill="white" stroke="#cfdae4"/><path d="M927 315 H1118 Q1125 315 1125 322 V346 H920 V322 Q920 315 927 315" fill="#24475f"/><text x="932" y="336" class="name">MISSION_INSTRUMENT</text><text x="932" y="364" class="field">PK instrument_id</text><text x="932" y="383" class="field">FK mission_id</text><text x="932" y="402" class="field">instrument_name, type</text><text x="932" y="421" class="field">UQ (mission_id, name)</text><rect x="35" y="390" width="205" height="96" rx="7" fill="white" stroke="#cfdae4"/><path d="M42 390 H233 Q240 390 240 397 V421 H35 V397 Q35 390 42 390" fill="#24475f"/><text x="47" y="411" class="name">DETECTION_METHOD</text><text x="47" y="439" class="field">PK method_id</text><text x="47" y="458" class="field">UQ method_name</text><text x="47" y="477" class="field">description</text><rect x="525" y="410" width="205" height="172" rx="7" fill="white" stroke="#cfdae4"/><path d="M532 410 H723 Q730 410 730 417 V441 H525 V417 Q525 410 532 410" fill="#24475f"/><text x="537" y="431" class="name">DISCOVERY</text><text x="537" y="459" class="field">PK discovery_id</text><text x="537" y="478" class="field">FK planet_id</text><text x="537" y="497" class="field">FK mission_id</text><text x="537" y="516" class="field">FK method_id</text><text x="537" y="535" class="field">FK reported_by</text><text x="537" y="554" class="field">date, signal, notes</text><text x="537" y="573" class="field">UQ planet/mission/method/date</text><rect x="35" y="690" width="205" height="115" rx="7" fill="white" stroke="#cfdae4"/><path d="M42 690 H233 Q240 690 240 697 V721 H35 V697 Q35 690 42 690" fill="#24475f"/><text x="47" y="711" class="name">RESEARCHER</text><text x="47" y="739" class="field">PK researcher_id</text><text x="47" y="758" class="field">first_name, last_name</text><text x="47" y="777" class="field">UQ email</text><text x="47" y="796" class="field">role: ADMIN / RESEARCHER</text><rect x="340" y="710" width="205" height="115" rx="7" fill="white" stroke="#cfdae4"/><path d="M347 710 H538 Q545 710 545 717 V741 H340 V717 Q340 710 347 710" fill="#24475f"/><text x="352" y="731" class="name">VALIDATION</text><text x="352" y="759" class="field">PK/FK researcher_id</text><text x="352" y="778" class="field">PK/FK discovery_id</text><text x="352" y="797" class="field">validation_date</text><text x="352" y="816" class="field">confidence_level</text><rect x="340" y="840" width="205" height="77" rx="7" fill="white" stroke="#cfdae4"/><path d="M347 840 H538 Q545 840 545 847 V871 H340 V847 Q340 840 347 840" fill="#24475f"/><text x="352" y="861" class="name">APP_ACCOUNT</text><text x="352" y="889" class="field">PK/FK researcher_id</text><text x="352" y="908" class="field">password_hash, enabled</text><rect x="920" y="620" width="205" height="134" rx="7" fill="white" stroke="#cfdae4"/><path d="M927 620 H1118 Q1125 620 1125 627 V651 H920 V627 Q920 620 927 620" fill="#24475f"/><text x="932" y="641" class="name">VALIDATION_AUDIT</text><text x="932" y="669" class="field">PK audit_id</text><text x="932" y="688" class="field">historical researcher_id</text><text x="932" y="707" class="field">historical discovery_id</text><text x="932" y="726" class="field">action, old/new confidence</text><text x="932" y="745" class="field">changed_at</text><text x="920" y="792" class="sub">Written by validation triggers.</text><text x="920" y="812" class="sub">No FKs: history survives deletion.</text><text x="35" y="940" class="sub">MongoDB notes use logical discovery_id / author_id references, not cross-database foreign keys.</text></svg>