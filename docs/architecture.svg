<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="565" viewBox="0 0 1050 565">
    <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7890a3"/></marker></defs>
    <rect width="100%" height="100%" fill="#f7f9fc"/><style>text{font-family:Arial,sans-serif;fill:#233e54}.title{font-size:27px;font-weight:bold}.sub{font-size:12px;fill:#71879b}.name{font-size:13px;font-weight:bold;fill:white}.field{font-size:11px}.edge{fill:none;stroke:#8b9eaf;stroke-width:1.5}.label{font-size:10px;fill:#526e87}</style>
    <text x="35" y="45" class="title">Orbit Archive / System architecture</text><text x="35" y="69" class="sub">Next.js frontend + backend · MySQL catalogue source of truth · MongoDB research context</text><path d="M250 180 H390 M595 180 H760 M865 225 V310 M495 225 V310 M595 365 H760" class="edge" marker-end="url(#arrow)"/><rect x="45" y="130" width="205" height="96" rx="7" fill="white" stroke="#cfdae4"/><path d="M52 130 H243 Q250 130 250 137 V161 H45 V137 Q45 130 52 130" fill="#24475f"/><text x="57" y="151" class="name">BROWSER</text><text x="57" y="179" class="field">Admin / Researcher</text><text x="57" y="198" class="field">Catalogue and filters</text><text x="57" y="217" class="field">Reviews and research notes</text><rect x="390" y="130" width="205" height="96" rx="7" fill="white" stroke="#cfdae4"/><path d="M397 130 H588 Q595 130 595 137 V161 H390 V137 Q390 130 397 130" fill="#24475f"/><text x="402" y="151" class="name">NEXT.JS</text><text x="402" y="179" class="field">Responsive interface</text><text x="402" y="198" class="field">Route Handlers / API</text><text x="402" y="217" class="field">Signed session + role checks</text><rect x="760" y="130" width="240" height="96" rx="7" fill="white" stroke="#cfdae4"/><path d="M767 130 H993 Q1000 130 1000 137 V161 H760 V137 Q760 130 767 130" fill="#24475f"/><text x="772" y="151" class="name">MYSQL</text><text x="772" y="179" class="field">11 relational tables</text><text x="772" y="198" class="field">Keys / checks / indexes</text><text x="772" y="217" class="field">Transactions and procedures</text><rect x="390" y="310" width="205" height="96" rx="7" fill="white" stroke="#cfdae4"/><path d="M397 310 H588 Q595 310 595 317 V341 H390 V317 Q390 310 397 310" fill="#24475f"/><text x="402" y="331" class="name">MONGODB</text><text x="402" y="359" class="field">Validated note documents</text><text x="402" y="378" class="field">Text index and retrieval</text><text x="402" y="397" class="field">Tag aggregation pipeline</text><rect x="760" y="310" width="240" height="96" rx="7" fill="white" stroke="#cfdae4"/><path d="M767 310 H993 Q1000 310 1000 317 V341 H760 V317 Q760 310 767 310" fill="#24475f"/><text x="772" y="331" class="name">INTEGRITY + HISTORY</text><text x="772" y="359" class="field">Discovery / review triggers</text><text x="772" y="378" class="field">Parent integrity guards</text><text x="772" y="397" class="field">Validation audit</text><text x="45" y="490" class="sub">Environment variables supply credentials and the session secret. SQL values use parameter placeholders.</text><text x="45" y="514" class="sub">No distributed transaction: SQL discovery existence is checked before note creation; manual deletes require coordinated cleanup.</text></svg>